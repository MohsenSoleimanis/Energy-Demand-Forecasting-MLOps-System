apiVersion: v1
kind: Service
metadata:
  name: energy-forecast-api
  namespace: energy-forecast
  labels:
    app.kubernetes.io/name: energy-forecast-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: energy-demand-forecasting
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "ClusterIP service for Energy Forecast API"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: energy-forecast-api
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

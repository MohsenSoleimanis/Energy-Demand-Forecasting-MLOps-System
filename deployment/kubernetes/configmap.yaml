apiVersion: v1
kind: ConfigMap
metadata:
  name: energy-forecast-config
  namespace: energy-forecast
  labels:
    app.kubernetes.io/name: energy-forecast-api
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: energy-demand-forecasting
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "Configuration for Energy Forecast API"
data:
  APP_NAME: "energy-forecast-api"
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  API_WORKERS: "2"
  MLFLOW_TRACKING_URI: "http://mlflow.energy-forecast.svc.cluster.local:5000"
  MODEL_REGISTRY_URI: "http://mlflow.energy-forecast.svc.cluster.local:5000"
  ENABLE_METRICS: "true"
  METRICS_PORT: "8000"
  CORS_ORIGINS: "*"
  REQUEST_TIMEOUT: "30"
  MAX_BATCH_SIZE: "100"

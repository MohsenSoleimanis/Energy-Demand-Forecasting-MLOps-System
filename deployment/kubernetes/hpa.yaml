apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: energy-forecast-api
  namespace: energy-forecast
  labels:
    app.kubernetes.io/name: energy-forecast-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: energy-demand-forecasting
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "HPA for Energy Forecast API"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: energy-forecast-api
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

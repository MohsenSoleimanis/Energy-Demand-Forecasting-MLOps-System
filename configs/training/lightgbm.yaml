model:
  n_estimators: 1000
  learning_rate: 0.05
  max_depth: 8
  num_leaves: 63
  min_child_samples: 20
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 0.1
  early_stopping_rounds: 50

split:
  train_ratio: 0.70
  val_ratio: 0.15

random_seed: 42

experiment_name: "energy-demand-forecast"
model_name: "energy-demand-forecast"

quality_gates:
  max_mape: 0.07
  min_training_rows: 8000

tuning:
  n_trials: 20

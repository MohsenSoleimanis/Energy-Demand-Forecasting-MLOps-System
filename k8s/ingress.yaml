apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forecast-api-ingress
  namespace: energy-forecast
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - forecast-api.example.com
      secretName: forecast-tls
  rules:
    - host: forecast-api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forecast-api-service
                port:
                  number: 80

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "energy-demand-mlops"
version = "0.1.0"
description = "Belgian Energy Demand Forecasting MLOps System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Data ingestion
    "entsoe-py>=0.7.0,<1.0",
    "requests>=2.31.0,<3.0",
    "holidays>=0.63,<1.0",
    # Data processing
    "pandas>=2.2.0,<3.0",
    "numpy>=1.26.0,<3.0",
    "pyarrow>=14.0.0",
    # ML / Training
    "scikit-learn>=1.5.0,<2.0",
    "lightgbm>=4.5.0,<5.0",
    # Experiment tracking
    "mlflow>=2.18.0,<3.0",
    # Validation & Serving
    "pydantic>=2.10.0,<3.0",
    "fastapi>=0.115.0,<1.0",
    "uvicorn>=0.32.0,<1.0",
    # Monitoring
    "prometheus-client>=0.21.0,<1.0",
    # Storage
    "boto3>=1.35.0,<2.0",
    # Config
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0",
    "pytest-cov>=5.0.0,<6.0",
    "ruff>=0.7.0,<1.0",
    "httpx>=0.28.0,<1.0",
]
# Heavy optional deps - install separately if needed
extras = [
    "shap>=0.46.0,<1.0",
    "evidently>=0.5.0,<1.0",
    "great-expectations>=1.2.0,<2.0",
    "dvc[s3]>=3.56.0,<4.0",
    "duckdb>=1.1.0,<2.0",
    "hydra-core>=1.3.0,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (may need services running)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "E501",   # line too long
    "N803",   # argument name should be lowercase (ML convention: X for feature matrix)
    "N806",   # variable name should be lowercase (ML convention: X_train, X_test)
    "B017",   # pytest.raises(Exception) is acceptable in schema validation tests
    "UP042",  # StrEnum - we use plain Enum for broader compatibility
    "E402",   # module-level import not at top - needed for pytest.importorskip guards
    "TCH",    # type-checking block suggestions - not critical
    "B008",   # Depends() in FastAPI signatures is the standard pattern
    "SIM108", # ternary operator suggestion - explicit if/else more readable in some cases
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "energy-demand-mlops"
version = "0.1.0"
description = "Belgian Energy Demand Forecasting MLOps System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Data ingestion
    "entsoe-py==0.6.11",
    "requests>=2.31.0,<3.0",
    "openmeteo-requests==1.3.0",
    # Data processing
    "pandas>=2.2.0,<3.0",
    "numpy>=1.26.0,<2.0",
    "polars>=1.5.0,<2.0",
    "duckdb>=1.1.0,<2.0",
    "pyarrow>=17.0.0,<18.0",
    "deltalake>=0.21.0,<1.0",
    # ML / Training
    "scikit-learn>=1.5.0,<2.0",
    "lightgbm>=4.5.0,<5.0",
    "xgboost>=2.1.0,<3.0",
    "optuna>=4.0.0,<5.0",
    "shap>=0.46.0,<1.0",
    # Experiment tracking
    "mlflow>=2.18.0,<3.0",
    "dvc[s3]>=3.56.0,<4.0",
    # Validation
    "great-expectations>=1.2.0,<2.0",
    "pydantic>=2.9.0,<3.0",
    # Serving
    "fastapi>=0.115.0,<1.0",
    "uvicorn>=0.32.0,<1.0",
    # Monitoring
    "evidently>=0.4.40,<1.0",
    "prometheus-client>=0.21.0,<1.0",
    # Storage
    "boto3>=1.35.0,<2.0",
    "minio>=7.2.0,<8.0",
    # Orchestration
    "apache-airflow>=2.10.0,<3.0",
    # Utilities
    "python-dotenv>=1.0.0,<2.0",
    "loguru>=0.7.0,<1.0",
    "click>=8.1.0,<9.0",
    "tenacity>=9.0.0,<10.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0",
    "pytest-cov>=5.0.0,<6.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "ruff>=0.7.0,<1.0",
    "mypy>=1.13.0,<2.0",
    "httpx>=0.27.0,<1.0",
    "pre-commit>=4.0.0,<5.0",
]
serving = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn>=0.32.0,<1.0",
    "prometheus-client>=0.21.0,<1.0",
    "pydantic>=2.9.0,<3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "E501",   # line too long
    "N803",   # argument name should be lowercase (ML convention: X for feature matrix)
    "N806",   # variable name should be lowercase (ML convention: X_train, X_test)
    "B017",   # pytest.raises(Exception) is acceptable in schema validation tests
    "UP042",  # StrEnum - we use plain Enum for broader compatibility
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "energy-forecast"
version = "1.0.0"
description = "Production-scale Energy Demand Forecasting MLOps System"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<2.0",
    "pandas>=2.0,<3.0",
    "scikit-learn>=1.3,<2.0",
    "xgboost>=2.0,<3.0",
    "torch>=2.1,<3.0",
    "mlflow>=2.9,<3.0",
    "optuna>=3.4,<4.0",
    "fastapi>=0.104,<1.0",
    "uvicorn[standard]>=0.24,<1.0",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.1,<3.0",
    "pyyaml>=6.0,<7.0",
    "great-expectations>=0.18,<1.0",
    "evidently>=0.4,<1.0",
    "prometheus-client>=0.19,<1.0",
    "pyarrow>=14.0,<16.0",
    "holidays>=0.40,<1.0",
    "structlog>=23.2,<25.0",
    "httpx>=0.25,<1.0",
    "boto3>=1.33,<2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.8",
    "mypy>=1.7",
    "pre-commit>=3.6",
    "ipykernel>=6.27",
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4.0",
    "httpx>=0.25",
]
airflow = [
    "apache-airflow>=2.8,<3.0",
    "apache-airflow-providers-docker>=3.9",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "performance: Performance benchmark tests",
]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
